[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pop2obs"
dynamic = ["version"]
description = "Synthetic observations from particle-resolved aerosol populations, for developing and evaluating population-inference methods."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Laura Fierce", email = "laura.fierce@pnnl.gov" }]
dependencies = [
  "numpy",
  "part2pop>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.5",
]

[tool.setuptools.dynamic]
version = {attr = "pop2obs.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
